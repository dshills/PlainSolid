      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzParabolicRoof$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzMappedParabolicRoof$ -fuzztime=100x -parallel=1 -timeout=90s
