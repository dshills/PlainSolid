name: Go CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: go-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    name: Go smoke (${{ matrix.os }}, ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, go: stable}
          - {os: ubuntu-latest, go: '1.23.x'}
          - {os: windows-latest, go: stable}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod
      - name: Format
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Compile packages and exercise smoke cases
        shell: bash
        run: bash tools/ci/smoke.sh
      - name: Vet
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go vet ./...
      - name: Build PlainCAD WASM
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/plainsolid.wasm" ./cmd/plaincadwasm
