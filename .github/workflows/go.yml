      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzMixedEccentricMaterial$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzConical45Frustum$ -fuzztime=100x -parallel=1 -timeout=90s
