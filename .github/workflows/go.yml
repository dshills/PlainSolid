      - run: GOMAXPROCS=2 go test ./exchange/step -run=^$ -fuzz=^FuzzDAGRationalMapped$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/step -run=^$ -fuzz=^FuzzDAGSharedPlacements$ -fuzztime=100x -parallel=1 -timeout=90s
