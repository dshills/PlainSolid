      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzMixedBoredMaterial$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: go test ./brep/parametric -fuzz=FuzzReadJSON -fuzztime=10s -parallel=2
