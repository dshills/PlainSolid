name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Tests outside the trimmed-solid package
        shell: bash
        run: |
          packages=$(go list ./...)
          packages=$(printf '%s\n' "$packages" | awk '$0 != "plainsolid/brep/trimmed"')
          go test -timeout 45m $packages
      - run: go vet ./...
      - name: Race detector
        if: runner.os != 'Windows'
        shell: bash
        run: |
          packages=$(go list ./...)
          packages=$(printf '%s\n' "$packages" | awk '$0 != "plainsolid/brep/trimmed"')
          go test -race -timeout 60m $packages
  trimmed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', stable]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Trimmed-solid tests
        shell: bash
        run: bash tools/ci/trimmed-shard.sh ${{ matrix.shard }} 3 -timeout 45m
      - name: Trimmed-solid race detector
        if: runner.os != 'Windows'
        shell: bash
        run: bash tools/ci/trimmed-shard.sh ${{ matrix.shard }} 3 -race -timeout 60m
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test ./exchange -fuzz=FuzzReadSTL -fuzztime=10s -parallel=2
      - run: go test ./exchange -fuzz=FuzzReadOBJ -fuzztime=10s -parallel=2
      - run: go test ./exchange -fuzz=FuzzReadJSON -fuzztime=10s -parallel=2
      - run: go test ./exchange -fuzz=FuzzReadPLY -fuzztime=10s -parallel=2
      - run: go test ./exchange -fuzz=FuzzReadBRepJSON -fuzztime=10s -parallel=2
      - run: go test ./document -fuzz=FuzzRead -fuzztime=10s -parallel=2
      - run: go test ./query -fuzz=FuzzTriangleQueries -fuzztime=10s -parallel=2
      - run: go test ./exchange -fuzz=FuzzReadGLTF -fuzztime=10s -parallel=2
      - run: go test ./exchange/step -fuzz=FuzzParse -fuzztime=10s -parallel=2
      - run: GOMAXPROCS=2 go test ./exchange/step -run=^$ -fuzz=^FuzzReadSideCutProducts$ -fuzztime=128x -parallel=1 -timeout=180s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipseConic$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzQuarterEllipseConic$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipseConicRing$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipseTabulated$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipseDiskFace$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipseAnnulusFace$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipticalPrismTopology$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzEllipticalPrismMaterialNative$ -fuzztime=100x -parallel=1 -timeout=90s
