      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzCircularCylinderSolid$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzMixedCircularMaterial$ -fuzztime=100x -parallel=1 -timeout=90s
      - run: GOMAXPROCS=2 go test ./exchange/iges -run=^$ -fuzz=^FuzzPlacedCircularCylinder$ -fuzztime=100x -parallel=1 -timeout=90s
